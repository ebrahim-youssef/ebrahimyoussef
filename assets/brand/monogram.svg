<svg viewBox="0 0 64 64" xmlns="http://www.w3.org/2000/svg">
  <style>
    .bg { fill: #faf6ef; }
    .fg { fill: #c05c21; }
    @media (prefers-color-scheme: dark) {
      .bg { fill: #2b2118; }
      .fg { fill: #e4d3a1; }
    }
  </style>
  <polygon class="bg" stroke="#96431a" stroke-width="1.5" stroke-linejoin="round"
    points="6,2 58,2 62,6 62,58 58,62 6,62 2,58 2,6" />
  <!-- E: square-Kufic block spine + three arms -->
  <g class="fg">
    <rect x="6" y="8" width="8" height="48" />
    <rect x="6" y="8" width="24" height="8" />
    <rect x="6" y="28" width="16" height="8" />
    <rect x="6" y="48" width="24" height="8" />
  </g>
  <!-- Y: square-Kufic stem + stepped (right-angle) arms -->
  <g class="fg">
    <rect x="42" y="28" width="8" height="28" />
    <rect x="36" y="20" width="8" height="8" />
    <rect x="32" y="12" width="8" height="8" />
    <rect x="48" y="20" width="8" height="8" />
    <rect x="52" y="12" width="8" height="8" />
  </g>
  <!-- single gold accent notch, bridging E and Y -->
  <rect x="30" y="28" width="8" height="8" fill="#c4972f" />
</svg>
