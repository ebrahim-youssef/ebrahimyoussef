packages:
  - '.'

allowBuilds:
  esbuild: true

# New releases wait 14 days before resolution (supply-chain rule).
minimumReleaseAge: 20160

# Overrides live in package.json ("pnpm.overrides"): Cloudflare Workers Builds uses pnpm 9,
# so the dependency fixes must remain in package.json for its frozen install.
# strnum is pinned to 2.4.2 because 2.5.x was under 14 days old when fast-xml-parser was added (2026-10-18).
